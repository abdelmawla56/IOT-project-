simulation:
  building_id: "b01"
  floors: 10
  rooms_per_floor: 20
  tick_interval: 10 # increased for initial stability
  sync_interval: 30 # Sync to SQLite every 30s
  max_jitter: 60    # Spread 200 connections over 60s
  outside_temp: 35.0

physics:
  alpha: 0.01       # Insulation Constant (Thermal Leakage)
  beta: 0.2         # HVAC Strength
  occ_temp_boost: 0.1 # Occupancy increases temp slightly
  light_threshold: 400

mqtt:
  broker: "broker.emqx.io" # UPDATED: Changed from localhost to EMQX broker for easier testing if user doesn't have a local one.
  port: 1883
  base_topic: "campus"

faults:
  probability: 0.05 # 5% chance of a fault event per tick
